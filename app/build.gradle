apply plugin: 'com.android.application'

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.0"

    defaultConfig {
        applicationId "com.example.myapplicationnewconver"
        minSdkVersion 24
        targetSdkVersion 30
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation(name: 'DayNightSwitch-1.2', ext: 'aar')
        api 'com.github.CanHub:Android-Image-Cropper:2.2.0'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-storage'
   implementation 'com.google.firebase:firebase-auth'
    implementation platform('com.google.firebase:firebase-bom:31.5.0')
    implementation 'androidx.multidex:multidex:2.0.1' // أضف هذا الاعتماد
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.wajahatkarim:EasyFlipView:3.0.3'

    
    implementation 'com.karumi:dexter:6.2.3'
    implementation 'id.zelory:compressor:2.1.1'
     //   implementation 'com.google.android.gms:play-services-measurement-base:21.1.0'

    implementation 'com.google.android.material:material:1.3.0'
    implementation(name: 'meow-bottom-navigation-java-1.2.0', ext: 'aar')
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    //implementation(name: 'souleimanetouch', ext: 'aar')
    implementation 'com.github.labsisouleimen:TouchFlip3D:v1.1'

    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0-beta02'

     }
configurations.all {
    resolutionStrategy {
        // إجبار المشروع على استخدام نسخة واحدة من مكتبة الكور الخاصة بكوتلن
        force "org.jetbrains.kotlin:kotlin-stdlib:1.4.32"
    }
}
