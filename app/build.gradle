task copySpecificAARToProject {
    doLast {
        // تحديد اسم المكتبة التي تريد نسخها
        def libraryName = "Android-Image-Cropper"

        // تحديد كاش Gradle
        def gradleCache = file("${gradle.gradleUserHomeDir}/caches/modules-2/files-2.1")

        // تحديد المجلد الهدف داخل المشروع
        def destDir = file("$projectDir/libs")
        if (!destDir.exists()) {
            destDir.mkdirs()
        }

        // البحث عن المكتبة ونسخها
        boolean libraryFound = false
        gradleCache.eachFileRecurse { file ->
            if (file.name.contains(libraryName) && file.name.endsWith(".aar")) {
                copy {
                    from file
                    into destDir
                }
                println "Copied: ${file.name} to ${destDir.absolutePath}"
                libraryFound = true
            }
        }

        if (libraryFound) {
            println "Library $libraryName has been successfully copied to: ${destDir.absolutePath}"
        } else {
            println "Library $libraryName not found in Gradle cache."
        }
    }
}





















